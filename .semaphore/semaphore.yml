version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Build docker image
    dependencies: []
    task:
      jobs:
        - name: Build
          commands:
            - echo "$DOCKER_NAME"
            - echo $DOCKER_NAME
            - docker login -u "$DOCKER_NAME" --password-stdin
      secrets:
        - name: Docker
